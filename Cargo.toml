[package]
name = "openjtalk-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Open JTalk frontend for Japanese text: morphological analysis and HTS full-context label generation via CXX FFI, extracted from espnet-burn."

[dependencies]
cxx = "1.0"
tar = "0.2"
flate2 = "1.0"
ureq = "3.0"
thiserror = "2.0"

[build-dependencies]
cxx-build = "1.0"
